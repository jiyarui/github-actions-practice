name: 部署文档到GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装mkdocs
        run: pip install mkdocs

      - name: 构建静态网页
        run: mkdocs build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: 部署到Pages
        uses: actions/deploy-pages@v4
